name: Idea / feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Comunimate to do? How would you use it in game?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
